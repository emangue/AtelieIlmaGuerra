# =============================================================================
# Ateliê Ilma Guerra — atendimento.atelieilmaguerra.com.br
# =============================================================================
# Site do balcão: cadastro de clientes e registro de pedidos para aprovação.
# Backend :8002 e frontend :3005 rodam no HOST; o nginx roda no container
# infra_nginx e chega no host por 172.20.0.1 (IP do host na rede
# finup_finup-net) — mesmo padrão do gestao.atelieilmaguerra.com.br.conf.
#
# Instalar em: /var/www/infra/nginx/conf.d/atendimento.atelieilmaguerra.com.br.conf
# Depois: docker exec infra_nginx nginx -t && docker exec infra_nginx nginx -s reload
#
# Pré-requisitos:
#   1. Registro DNS A "atendimento" -> 148.230.78.91
#   2. Certificado emitido pelo certbot do FinUp (/opt/finup/certbot)
# =============================================================================

server {
    listen 80;
    server_name atendimento.atelieilmaguerra.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name atendimento.atelieilmaguerra.com.br;

    ssl_certificate     /etc/letsencrypt/live/atendimento.atelieilmaguerra.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atendimento.atelieilmaguerra.com.br/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;
    # Fotos de referência: o backend limita cada arquivo em 8 MB.
    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://172.20.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://172.20.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://172.20.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
